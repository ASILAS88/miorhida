<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Миорхида — редактор карты</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%226.5%22%20fill%3D%22%233f7fd0%22%20stroke%3D%22%23111%22/%3E%3Cpath%20d%3D%22M4%205.5l2.5-1%202%201.5-1%202%202%201.5-.5%202.5-3-.5-2-2z%22%20fill%3D%22%237ccf45%22/%3E%3Cpath%20d%3D%22M10%203.5l2%201%20.5%202.5-2%20.5z%22%20fill%3D%22%237ccf45%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#2a2725">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>:root{
  --bg:#1b1918; --panel:#2e2b29; --panel2:#3b3836; --edge:#121110; --hi:#58534f;
  --txt:#f3efe8; --dim:#b0a99f; --gold:#f3c63b; --red:#d9443a; --green:#6bbf4a; --ocean:#244f8c;
  --font:"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pix:"Press Start 2P","Trebuchet MS",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
svg{display:block;shape-rendering:crispEdges}

#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto auto auto;}
#top{display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(#3d3a37,#2a2725);
  border-bottom:3px solid var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.1);min-height:46px}
#brand{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:10px;line-height:1.3;color:var(--gold);
  text-shadow:0 2px 0 #000;white-space:nowrap}
#brand .logo{width:26px;height:26px;flex:none}
#yearbox{display:flex;align-items:center;gap:4px;margin:0 auto}
#ylabel{font-family:var(--pix);font-size:13px;min-width:112px;text-align:center;color:#fff;text-shadow:0 2px 0 #000;
  padding:8px 6px;background:#1d1b1a;border:2px solid var(--edge);border-radius:6px;box-shadow:inset 0 0 0 1px var(--hi)}
#topbtns{display:flex;gap:4px}
.ibtn{width:38px;height:38px;padding:5px;display:grid;place-items:center;border-radius:7px;border:2px solid var(--edge);
  background:linear-gradient(#5a5653,#3f3b39);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.5)}
.ibtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.ibtn[disabled]{opacity:.35;pointer-events:none}
.ibtn svg{width:100%;height:100%}

#stage{position:relative;overflow:hidden;background:var(--ocean);min-height:120px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#info{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);padding:5px 9px;border-radius:6px;font-size:12px;font-weight:700;
  background:rgba(20,18,17,.72);border:1px solid rgba(255,255,255,.12);pointer-events:none;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{position:absolute;left:50%;top:44px;transform:translateX(-50%);max-width:88%;padding:9px 14px;border-radius:8px;text-align:center;
  background:rgba(20,18,17,.86);border:2px solid var(--gold);font-size:13px;line-height:1.35;display:none;pointer-events:none}
#zoombtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}

#tools{display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;background:#2a2725;border-top:3px solid var(--edge);
  scrollbar-width:none}
#tools::-webkit-scrollbar,#timeline .chips::-webkit-scrollbar{display:none}
.tool{flex:none;width:44px;height:44px;padding:6px;border-radius:8px;border:2px solid var(--edge);
  background:linear-gradient(#55514e,#393634);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.5);position:relative}
.tool svg{width:100%;height:100%}
.tool.on{background:linear-gradient(#f6d35d,#c9941a);border-color:#6d4b05;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 rgba(0,0,0,.5)}
.tool:active{transform:translateY(2px)}
.sep{flex:none;width:2px;height:30px;background:var(--edge);box-shadow:1px 0 0 var(--hi);margin:0 2px}
.stepper{flex:none;display:flex;align-items:center;gap:2px}
.stepper .val{min-width:38px;text-align:center;font-family:var(--pix);font-size:11px;padding:8px 2px;background:#1d1b1a;border:2px solid var(--edge);border-radius:6px}
.stepper .ibtn{width:32px;height:38px;font-weight:900;font-size:20px;line-height:1}
#target{flex:1 0 auto;min-width:150px;max-width:260px;display:flex;align-items:center;gap:8px;padding:5px 9px;height:44px;text-align:left;
  background:#1d1b1a;border:2px solid var(--edge);border-radius:8px;box-shadow:inset 0 0 0 1px var(--hi)}
#target canvas{flex:none}
#target .t1{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
#target .t2{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#target>div{min-width:0}

#timeline{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#262321;border-top:2px solid var(--edge)}
#timeline .chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;scroll-behavior:smooth}
.chip{flex:none;padding:7px 11px;border-radius:16px;border:2px solid var(--edge);font-weight:800;font-size:14px;
  background:linear-gradient(#4b4745,#343130);box-shadow:inset 0 2px 0 rgba(255,255,255,.1)}
.chip.on{background:linear-gradient(#f6d35d,#c9941a);color:#2b1d05;border-color:#6d4b05}
.chip.note::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7ecbff;margin-left:6px;vertical-align:middle}

#panelwrap{display:flex;flex-direction:column-reverse;background:var(--panel);border-top:3px solid var(--edge);min-height:0}
#tabs{display:flex;background:#242120}
.tab{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-right:2px solid var(--edge);
  background:linear-gradient(#3a3735,#2a2725);font-size:11px;font-weight:700;color:var(--dim);min-width:0}
.tab:last-child{border-right:0}
.tab svg{width:22px;height:22px}
.tab.on{color:#fff;background:linear-gradient(#5b5652,#3d3a38);box-shadow:inset 0 3px 0 var(--gold)}
#panelbody{display:none;overflow-y:auto;overflow-x:hidden;max-height:34vh;padding:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#panelwrap.open #panelbody{display:block}

.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ph h3{margin:0;font-family:var(--pix);font-size:10px;line-height:1.5;color:var(--gold);text-shadow:0 2px 0 #000}
.btn{min-height:40px;padding:8px 13px;border-radius:7px;border:2px solid var(--edge);font-weight:800;
  background:linear-gradient(#5a5653,#3f3b39);text-shadow:0 2px 0 rgba(0,0,0,.55);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.gold{background:linear-gradient(#f6d35d,#d29a1a);color:#2b1d05;text-shadow:0 1px 0 rgba(255,255,255,.4);border-color:#6d4b05}
.btn.red{background:linear-gradient(#e45a4f,#a92a22)}
.btn.blue{background:linear-gradient(#5aa2ee,#2f66b6)}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row.wrap{flex-wrap:wrap}
.row > label.grow{flex:1}
.note{font-size:12.5px;color:var(--dim);line-height:1.4}
.note b{color:var(--txt)}
.empty{padding:18px 8px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.45}

.list{display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;border:2px solid var(--edge);
  background:linear-gradient(#3d3a38,#302d2b);box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.card.on{border-color:var(--gold);background:linear-gradient(#4b463e,#3a362f);box-shadow:inset 0 0 0 1px rgba(243,198,59,.4)}
.card .meta{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:12px;color:var(--dim)}
.card canvas{flex:none}
.sw{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--edge);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}

.seg{display:flex;border:2px solid var(--edge);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;border:0;border-right:2px solid var(--edge);background:#3a3735;font-weight:700;font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(#f6d35d,#c9941a);color:#2b1d05}

.sl{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.sl span.l{flex:0 0 118px}
.sl input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.sl span.v{flex:0 0 46px;text-align:right;color:var(--dim);font-size:12px}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14.5px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--gold);flex:none}

input[type=text],input[type=number],textarea,select{width:100%;padding:9px 10px;border-radius:7px;border:2px solid var(--edge);
  background:#1d1b1a;color:var(--txt);font:inherit;font-size:15px;box-shadow:inset 0 0 0 1px var(--hi)}
input[type=color]{width:46px;height:40px;padding:2px;border-radius:7px;border:2px solid var(--edge);background:#1d1b1a;flex:none}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.3}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.swatches button{width:30px;height:30px;border-radius:6px;border:2px solid var(--edge);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.swatches button.on{outline:3px solid #fff}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{width:46px;height:52px;border-radius:7px;border:2px solid var(--edge);background:#3a3735;padding:3px;display:grid;place-items:center}
.pick button.on{border-color:var(--gold);background:#4b463e}

.status{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;background:#201e1c;border:2px solid var(--edge);font-size:13.5px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:#888;box-shadow:0 0 0 2px #000}
.dot.ok{background:#6bd24a}.dot.pend{background:#f3c63b}.dot.err{background:#e5483d}.dot.loc{background:#7ecbff}
hr{border:0;border-top:2px solid var(--edge);box-shadow:0 1px 0 var(--hi);margin:14px 0}

#modal{position:fixed;inset:0;z-index:50;background:rgba(8,7,6,.72);display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden]{display:none}
.mbox{width:100%;max-width:460px;max-height:92vh;display:flex;flex-direction:column;border-radius:12px;border:3px solid var(--edge);
  background:var(--panel);box-shadow:inset 0 2px 0 var(--hi),0 10px 30px rgba(0,0,0,.6)}
.mbox h2{margin:0;padding:12px 14px;font-family:var(--pix);font-size:11px;line-height:1.5;color:var(--gold);text-shadow:0 2px 0 #000;
  background:linear-gradient(#3d3a37,#2a2725);border-radius:9px 9px 0 0;border-bottom:3px solid var(--edge)}
.mbody{padding:12px 14px;overflow-y:auto;touch-action:pan-y}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px 14px}
.mfoot .btn{flex:1 1 auto}
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,10px);z-index:60;max-width:90%;padding:9px 14px;border-radius:9px;
  background:rgba(20,18,17,.95);border:2px solid var(--gold);font-weight:700;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:70;background:#1b1918;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  font-family:var(--pix);font-size:11px;color:var(--gold);text-align:center;line-height:1.8}
#loading[hidden]{display:none}
#loading .bar{width:180px;height:14px;border:3px solid var(--edge);background:#000;border-radius:4px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--gold);animation:ld 1.1s infinite linear}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}

@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr) auto auto}
  #top{grid-column:1/3;grid-row:1}
  #stage{grid-column:1;grid-row:2}
  #tools{grid-column:1;grid-row:3}
  #timeline{grid-column:1;grid-row:4}
  #panelwrap{grid-column:2;grid-row:2/5;flex-direction:column;border-top:0;border-left:3px solid var(--edge)}
  #panelbody{display:block;flex:1;max-height:none;padding:12px}
  #tabs .tab{padding:10px 2px}
  #toast{bottom:90px}
  #brand{font-size:11px}
}
@media (max-width:899px){
  #tools{flex-wrap:wrap;overflow:visible}
  #tools .sep{display:none}
  #target{flex:1 1 150px}
}
@media (max-width:520px){
  #brand b{display:none}
  #ylabel{min-width:96px;font-size:12px}
}

#yearnote{position:absolute;top:12px;right:12px;z-index:20;width:min(330px,calc(100% - 24px));padding:12px 34px 12px 14px;border-radius:12px;
  background:rgba(22,20,18,.9);border:1px solid rgba(243,198,59,.45);box-shadow:0 8px 24px rgba(0,0,0,.45);color:#eee;
  opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .25s,transform .25s}
#yearnote.show{opacity:1;transform:none;pointer-events:auto}
#yearnote .yn-y{font-weight:800;color:#f3c63b;font-size:15px;margin-bottom:5px;letter-spacing:.02em}
#yearnote .yn-t{font-size:13.5px;line-height:1.45;max-height:40vh;overflow:auto}
#yearnote .yn-x{position:absolute;top:6px;right:8px;background:none;border:0;color:#bbb;font-size:20px;cursor:pointer;line-height:1}

#bio{position:absolute;left:8px;bottom:8px;z-index:21;width:min(400px,calc(100% - 16px));max-height:min(70%,560px);display:flex;flex-direction:column;
  border-radius:12px;background:rgba(22,20,18,.95);border:1px solid rgba(243,198,59,.5);box-shadow:0 8px 28px rgba(0,0,0,.5);color:#eee;
  opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .2s,transform .2s}
#bio.show{opacity:1;transform:none;pointer-events:auto}
#bio .bio-h{display:flex;align-items:center;gap:9px;padding:10px 10px 8px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
#bio .bio-tt{flex:1;min-width:0;font-weight:800;color:#f3c63b;font-size:15px;line-height:1.25}
#bio .bio-x{background:none;border:0;color:#bbb;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
#bio .bio-b{padding:10px 12px;overflow:auto;flex:1;min-height:0}
#bio .bio-span{font-size:12px;color:#b8b0a3;font-style:italic;margin-bottom:6px}
#bio .bio-t p{margin:0 0 8px;font-size:13.8px;line-height:1.5}
#bio .bio-f{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.08)}
#bio .bio-f>span:first-child{margin-right:auto}
#bio .bio-ed{font-size:12px;color:#7ecbff}
#bio .bio-ta{width:100%;min-height:200px;font-family:inherit;font-size:14px;line-height:1.45;box-sizing:border-box}
#bio input[type=text]{width:100%;box-sizing:border-box}
#bio select{width:100%;margin-top:8px}
.ibtn.faint{opacity:.35}
@media (max-width:899px){#bio{left:6px;right:6px;bottom:6px;width:auto;max-height:62%}}
body.view #tools{display:none}
body.view #info{display:none}
#yearbox #yfirst,#yearbox #ylast{width:34px}
@media (max-width:420px){#yearbox #yfirst,#yearbox #ylast{width:28px}}

#panelbody a{color:var(--gold);word-break:break-all}
details.gh summary{cursor:pointer;margin:10px 0 4px;font-weight:700}
</style></head><body>

const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 15) ? c : k === 1 ? a : (k >= 2 && k <= 4) ? b : c; };
const BRUSHES = [1, 2, 3, 4, 5, 6, 8, 10];

/* ================= ДАННЫЕ ================= */
function mkSnap(P, year) {
  const n = P.world.w * P.world.h;
  return { year, note: '', states: [], provs: [], owner: new Uint16Array(n), prov: new Uint16Array(n), ver: 0, _u: [], _r: [] };
}
function cloneSnap(sn, year) {
  return { year, note: '', states: clone(sn.states), provs: clone(sn.provs), owner: sn.owner.slice(), prov: sn.prov.slice(), ver: 0, _u: [], _r: [] };
}
function newProject() {
  const P = { name: 'Мир', world: { w: WORLD.w, h: WORLD.h }, nextState: 1, nextProv: 1, snaps: [], bioEdits: emptyBioEdits() };
  P.snaps.push(mkSnap(P, 1));
  return P;
}
function rle(a) {
  const o = []; if (!a.length) return o; let v = a[0], n = 1;
  for (let i = 1; i < a.length; i++) { if (a[i] === v) n++; else { o.push(v, n); v = a[i]; n = 1; } }
  o.push(v, n); return o;
}
function unrle(arr, len) {
  const a = new Uint16Array(len); let p = 0;
  if (!Array.isArray(arr) || arr.length % 2) throw new Error('Неверная RLE-строка');
  for (let i = 0; i < arr.length; i += 2) { const v = arr[i] | 0, n = arr[i + 1] | 0; if (n < 0 || p + n > len) throw new Error('RLE выходит за размеры карты'); a.fill(v, p, p + n); p += n; }
  if (p !== len) throw new Error('RLE: клеток ' + p + ' вместо ' + len);
  return a;
}
function cleanState(s) {
  return {
    id: s.id | 0, name: String(s.name == null ? 'Без имени' : s.name).slice(0, 80),
    color: isHex(s.color) ? s.color : '#888888', color2: isHex(s.color2) ? s.color2 : '#ffffff',
    shape: clamp(s.shape | 0, 0, 2), emblem: clamp(s.emblem | 0, 0, EMB.length - 1),
    pop: Math.max(0, +s.pop || 0), cap: Array.isArray(s.cap) && s.cap.length === 2 ? [s.cap[0] | 0, s.cap[1] | 0] : null
  };
}
function snapToJSON(sn) { return { year: sn.year, note: sn.note || '', states: sn.states, provs: sn.provs, owner: rle(sn.owner), prov: rle(sn.prov) }; }
function snapFromJSON(P, o) {
  if (!o || typeof o !== 'object') throw new Error('Дата повреждена');
  const year = +o.year; if (!Number.isInteger(year) || year < 0 || year > 99999) throw new Error('Неверный год: ' + o.year);
  const n = P.world.w * P.world.h;
  const states = (o.states || []).map(cleanState);
  const ids = new Set(states.map(s => s.id));
  if (ids.size !== states.length || ids.has(0)) throw new Error('Год ' + year + ': повторяются или неверны id государств');
  const provs = (o.provs || []).map(p => ({ id: p.id | 0, sid: p.sid | 0, name: String(p.name == null ? 'Провинция' : p.name).slice(0, 80) })).filter(p => p.id > 0 && ids.has(p.sid));
  const pmap = new Map(provs.map(p => [p.id, p]));
  const owner = unrle(o.owner, n), prov = unrle(o.prov || [0, n], n);
  for (let i = 0; i < n; i++) {
    if (owner[i] && !ids.has(owner[i])) owner[i] = 0;
    if (prov[i]) { const p = pmap.get(prov[i]); if (!p || p.sid !== owner[i]) prov[i] = 0; }
  }
  return { year, note: String(o.note || ''), states, provs, owner, prov, ver: 0, _u: [], _r: [] };
}
function metaJSON(P) {
  return { format: FORMAT, version: 1, name: P.name, world: { w: P.world.w, h: P.world.h, tiles: WORLD.tiles, cellTiles: WORLD.cellTiles, originTile: WORLD.originTile }, nextState: P.nextState, nextProv: P.nextProv, seedApplied: P.seedApplied || '', userYears: P.userYears || [], years: P.snaps.map(s => s.year) };
}
function stringifyProject(P) {
  const m = metaJSON(P); delete m.years;
  m.bioEdits = P.bioEdits || emptyBioEdits();
  const head = JSON.stringify(m).slice(0, -1);
  return head + ',"snapshots":[\n' + P.snaps.map(s => JSON.stringify(snapToJSON(s))).join(',\n') + '\n]}';
}
/* Разбор текста. Возвращает {meta, snaps:[…]} без изменения текущего проекта. */
function parseProjectText(text) {
  let o; try { o = JSON.parse(text); } catch (e) { throw new Error('Это не JSON: ' + e.message); }
  if (o && o.format === 'miorhida-view' && Array.isArray(o.snapshots)) o = Object.assign({}, o, { format: FORMAT, world: { w: WORLD.w, h: WORLD.h } });
  if (o && o.owner && o.year != null) o = { format: FORMAT, world: { w: WORLD.w, h: WORLD.h }, snapshots: [o] };   // одиночная дата
  if (!o || o.format !== FORMAT || !Array.isArray(o.snapshots)) throw new Error('Не похоже на файл «Хроники мира» (нет format/snapshots)');
  const w = o.world && o.world.w | 0, hh = o.world && o.world.h | 0;
  if (w !== WORLD.w || hh !== WORLD.h) throw new Error('Размер карты ' + w + '×' + hh + ' не совпадает с ' + WORLD.w + '×' + WORLD.h);
  const P = { name: String(o.name || 'Мир'), world: { w, h: hh }, nextState: Math.max(1, o.nextState | 0), nextProv: Math.max(1, o.nextProv | 0), seedApplied: String(o.seedApplied || ''), userYears: Array.isArray(o.userYears) ? o.userYears.map(Number) : [], snaps: [], bioEdits: cleanBioEdits(o.bioEdits) };
  const seen = new Set();
  for (const s of o.snapshots) {
    const sn = snapFromJSON(P, s);
    if (seen.has(sn.year)) throw new Error('Год ' + sn.year + ' встречается дважды');
    seen.add(sn.year); P.snaps.push(sn);
  }
  P.snaps.sort((a, b) => a.year - b.year);

  return P;
}
function fixCounters(P) {
  let ms = 0, mp = 0;
  for (const sn of P.snaps) { for (const s of sn.states) ms = Math.max(ms, s.id); for (const p of sn.provs) mp = Math.max(mp, p.id); }
  P.nextState = Math.max(P.nextState | 0, ms + 1, 1); P.nextProv = Math.max(P.nextProv | 0, mp + 1, 1);
}

function capture(sn) { return { states: clone(sn.states), provs: clone(sn.provs), owner: sn.owner.slice(), prov: sn.prov.slice() }; }
function restoreSnap(sn, c) { sn.states = clone(c.states); sn.provs = clone(c.provs); sn.owner.set(c.owner); sn.prov.set(c.prov); sn.ver++; }
function pushHistory(sn, before, label) {

/* ================= СОХРАНЕНИЕ (облако db + локально) ================= */
const Store = {
  db: null, canCloud: false, mode: 'init', dirty: new Set(), del: new Set(), metaDirty: false,
  timer: 0, lsTimer: 0, busy: false, lastSaved: null, err: '', biosDirty: false,
  setMode(m, err) { this.mode = m; this.err = err || ''; if (window.UI && UI.updateSync) UI.updateSync(); },
  touch(year, meta) { if (HOSTED) Pub.mark(year, meta); this.dirty.add(year); this.del.delete(year); if (meta) this.metaDirty = true; this.sched(); },
  touchBios() { if (HOSTED) Pub.markBios(); this.biosDirty = true; this.sched(); },
  drop(year) { if (HOSTED) Pub.mark(year, true); this.dirty.delete(year); this.del.add(year); this.metaDirty = true; this.sched(); },
  sched() {
    if (VIEW) return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1800);
    clearTimeout(this.lsTimer); this.lsTimer = setTimeout(() => this.lsSave(), 1200);
    if (!HOSTED) this.setMode(this.canCloud ? 'pending' : 'local');
  },
  lsSave() { if (VIEW) return; try { localStorage.setItem('wbchron.v1', stringifyProject(S.P)); } catch (e) { /* может быть недоступно */ } },
  async flush() {
    if (HOSTED) { this.dirty.clear(); this.del.clear(); this.metaDirty = false; this.biosDirty = false; this.lsSave(); Pub.schedule(); return; }
    if (this.busy) { this.sched(); return; }
    if (!this.canCloud) { this.lsSave(); this.setMode('local'); return; }
    this.busy = true;
    const years = [...this.dirty], dels = [...this.del], meta = this.metaDirty, bios = this.biosDirty;
    this.dirty.clear(); this.del.clear(); this.metaDirty = false; this.biosDirty = false;
    try {
      for (const y of years) {
        const sn = S.P.snaps.find(s => s.year === y); if (!sn) continue;
        await this.db.doc('chronicle/y' + y).set({ year: y, json: JSON.stringify(snapToJSON(sn)) });
      }
      for (const y of dels) await this.db.doc('chronicle/y' + y).delete();
      if (bios) await this.db.doc('chronicle/bios').set({ json: JSON.stringify(S.P.bioEdits || emptyBioEdits()) });
      if (meta || years.length || dels.length) await this.db.doc('chronicle/meta').set({ json: JSON.stringify(metaJSON(S.P)) });
      this.lastSaved = new Date(); this.setMode(this.dirty.size || this.metaDirty || this.biosDirty ? 'pending' : 'saved');
    } catch (e) {
      years.forEach(y => this.dirty.add(y)); dels.forEach(y => this.del.add(y)); if (meta) this.metaDirty = true; if (bios) this.biosDirty = true;
      const code = e && e.code; this.setMode('error', code === 'quota_exceeded' ? 'Облако переполнено' : (e && e.message) || 'ошибка');
      clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 9000);
    }
    this.busy = false;
  },
  async init() {
    if (HOSTED) return SiteStore.init();
    let cloud = null, cloudOK = false;
    try {
      if (typeof claude !== 'undefined' && claude && claude.use) {
        const db = await Promise.race([claude.use('db'), new Promise(r => setTimeout(() => r('timeout'), 7000))]);
        if (db && db !== 'timeout') {
          this.db = db;
          try {
            const qs = await Promise.race([db.collection('chronicle').get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000))]);
            cloudOK = true;
            cloud = this.buildFromDocs(qs.docs);
          } catch (e) { cloudOK = false; this.err = 'Облако не ответило: ' + (e && e.message || e); }
        }
      }
    } catch (e) { /* без облака */ }
    let local = null;
    try { const t = localStorage.getItem('wbchron.v1'); if (t) local = parseProjectText(t); } catch (e) { local = null; }
    let src = '';
    if (cloud) { S.P = cloud; src = 'cloud'; }
    else if (local) { S.P = local; src = 'local'; }
    this.canCloud = cloudOK;
    if (src === 'local' && cloudOK) { S.P.snaps.forEach(s => this.dirty.add(s.year)); this.metaDirty = true; this.biosDirty = true; this.sched(); }
    this.setMode(cloudOK ? (this.dirty.size ? 'pending' : 'saved') : (this.db ? 'error' : 'local'), this.err);
    return src;
  },
  buildFromDocs(docs) {
    let meta = null, bios = null; const sj = [];
    for (const d of docs) {
      const data = d.data(); if (!data || typeof data.json !== 'string') continue;
      try { const o = JSON.parse(data.json); if (d.id === 'meta') meta = o; else if (d.id === 'bios') bios = o; else if (/^y\d+$/.test(d.id)) sj.push(o); } catch (e) { /* пропускаем битые */ }
    }
    if (!meta && !sj.length) return null;
    const P = { name: (meta && meta.name) || 'Мир', world: { w: WORLD.w, h: WORLD.h }, nextState: (meta && meta.nextState) | 0, nextProv: (meta && meta.nextProv) | 0, seedApplied: String((meta && meta.seedApplied) || ''), userYears: (meta && Array.isArray(meta.userYears)) ? meta.userYears.map(Number) : [], snaps: [], bioEdits: cleanBioEdits(bios) };
    const years = meta && Array.isArray(meta.years) ? new Set(meta.years) : null;
    for (const o of sj) { if (years && !years.has(+o.year)) continue; try { P.snaps.push(snapFromJSON(P, o)); } catch (e) { console.warn('Пропущена дата', e); } }
    if (!P.snaps.length) return null;
    P.snaps.sort((a, b) => a.year - b.year); fixCounters(P); return P;
  }
};

/* ================= СПРАВКИ О ГОСУДАРСТВАХ =================
   Справка привязана не к году, а к записи: правка видна на всех датах.

const BE = () => (S.P.bioEdits || (S.P.bioEdits = emptyBioEdits()));

/* ================= САЙТ (GitHub Pages) =================
   Редактор сохраняет правки в браузере и сам публикует их в репозиторий
   (файл data.json). Страница для читателей при каждом открытии берёт свежий data.json. */
const SITE_DATA = 'data.json';
let BIOS_ID = '';
function siteDataText(P) {
  const m = metaJSON(P); delete m.years;
  m.bioEdits = P.bioEdits || emptyBioEdits();
  m.bios = { id: BIOS_ID, entries: BIOS_BASE.entries, alias: BIOS_BASE.alias };
  m.at = new Date().toISOString();
  const head = JSON.stringify(m).slice(0, -1);

}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

const Pub = {
  cfg: { owner: '', repo: '', branch: 'main', token: '' },
  base: '', state: 'off', err: '', pubAt: null, timer: 0, busy: false, again: false, seedText: null,
  unpub: { years: [], bios: false, meta: false, all: false },
  DELAY: 25000,
  fromLocation() {
    const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i); if (!m) return null;

  },
  load() {
    const c = lsGet('miorh.gh', {}) || {}, loc = this.fromLocation() || {};

    const u = lsGet('miorh.unpub', null); if (u && Array.isArray(u.years)) this.unpub = { years: u.years.map(Number), bios: !!u.bios, meta: !!u.meta, all: !!u.all };

    const t = lsGet('miorh.pubAt', ''); this.pubAt = t ? new Date(t) : null;
  },
  saveCfg() { lsSet('miorh.gh', this.cfg); },
  saveUnpub() { lsSet('miorh.unpub', this.unpub); },
  ready() { return !!(this.cfg.owner && this.cfg.repo && this.cfg.token); },
  hasUnpub() { const u = this.unpub; return u.all || u.bios || u.meta || u.years.length > 0; },
  mark(year, meta) { if (year != null && !this.unpub.years.includes(year)) this.unpub.years.push(year); if (meta) this.unpub.meta = true; this.saveUnpub(); },
  markBios() { this.unpub.bios = true; this.saveUnpub(); },
  markAll() { this.unpub.all = true; this.saveUnpub(); },
  set(st, err) { this.state = st; this.err = err || ''; if (window.UI && UI.updateSync) UI.updateSync(); },
  schedule(ms) {
    if (!this.hasUnpub()) { this.set(this.ready() ? 'ok' : 'local'); return; }
    if (!this.ready()) { this.set('local'); return; }

  async api(path, opt) {
    opt = opt || {};

    const headers = { Accept: opt.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (c.token) headers.Authorization = 'Bearer ' + c.token;

  }
};

const SiteStore = {
  async init() {
    Pub.load();
    let local = null;
    try { const t = localStorage.getItem('wbchron.v1'); if (t) local = parseProjectText(t); } catch (e) { local = null; }
    let text = '', hd = null;
    if (Pub.ready()) {
      try { hd = await Pub.head(); if (hd.data) text = await Pub.blob(hd.data); if (hd.seed) Pub.seedText = await Pub.blob(hd.seed); }
      catch (e) { Pub.set('error', e.message); hd = null; text = ''; }
    }
    if (!text) { try { const r = await fetch(SITE_DATA + '?v=' + Date.now(), { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch (e) { /* */ } }
    let remote = null, ro = null;
    if (text) { try { ro = JSON.parse(text); remote = parseProjectText(text); } catch (e) { console.warn('data.json', e); } }
    if (ro && ro.bios && ro.bios.entries) { BIOS_BASE = { entries: ro.bios.entries, alias: ro.bios.alias || {} }; BIOS_ID = String(ro.bios.id || ''); }
    let src = '';
    if (local && Pub.hasUnpub()) {
      S.P = local; src = 'local';
      if (remote && hd && hd.data !== Pub.base && !Pub.unpub.all) { S.P = Pub.mergeInto(remote, local); src = 'merged'; }
    } else if (remote) {
      S.P = remote; src = 'site'; if (hd) { Pub.base = hd.data; lsSet('miorh.base', Pub.base); }
      Store.lsSave();
    } else if (local) { S.P = local; src = 'local'; }
    if (!S.P.bioEdits) S.P.bioEdits = emptyBioEdits();
    Store.canCloud = false;
    if (Pub.state !== 'error') Pub.schedule(Pub.hasUnpub() ? 4000 : null);
    return src;
  },
  async seed() {
    if (Pub.seedText) { try { return JSON.parse(Pub.seedText); } catch (e) { return null; } }
    try { const r = await fetch('seed.json?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; }
  }
};

const SITE_FILES = ['index.html', 'edit.html', 'seed.json', 'preview.png'];
async function uploadSiteFiles(fs) {

}

function hashSnap(sn) {
  const s = JSON.stringify(snapToJSON(sn)); let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(16)).slice(-8);
}
function hashOwner(sn) {
  const s = JSON.stringify(snapToJSON(sn).owner); let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(16)).slice(-8);
}
async function applySeed() {

  // даты, изменённые вручную после прошлой загрузки (не совпадают с прошлыми данными), не трогаем
  const prev = o.prevHash || null, kept = [], user = new Set(P.userYears || []);
  const merged = o.mergedOwner || {}, upd = [];
  for (const sn of P2.snaps) {
    const k = P.snaps.findIndex(s => s.year === sn.year);
    if (k >= 0 && prev) {
      const ph = prev[sn.year], hc = hashSnap(P.snaps[k]);
      const own = Array.isArray(ph) ? !ph.includes(hc) : ph !== hc;
      if (!own) user.delete(sn.year);
      if (own && merged[sn.year] && merged[sn.year] === hashOwner(P.snaps[k])) { user.delete(sn.year); upd.push(sn.year); }
      else if (own) { kept.push(sn.year); user.add(sn.year); continue; }
    }
    if (k >= 0) P.snaps[k] = sn; else P.snaps.push(sn); Store.touch(sn.year, true);
  }
  // цвета государств как в игре (по имени) — и в ваших датах тоже, меняется только цвет
  const rc = o.recolor || {};
  for (const sn of P.snaps) {
    let ch = false;

    if (ch) Store.touch(sn.year, true);
  }

  P.snaps.sort((a, b) => a.year - b.year); fixCounters(P);
  P.seedApplied = o.seedId; if (o.name) P.name = o.name; Store.metaDirty = true; Store.sched();
  S.cur = Math.max(0, P.snaps.length - 1); S.selState = 0; S.selProv = 0; S.target = 'state';
  return 'Загружены карты Миорхиды: ' + (P2.snaps.length - kept.length) + ' дат' + (kept.length ? '. Ваши правки сохранены: ' + kept.join(', ') : '') + (upd.length ? '. Ваши правки перенесены в обновлённые даты: ' + upd.join(', ') : '');
}
